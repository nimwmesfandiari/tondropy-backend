<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>TON Dropy - پنل مدیریت</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top right,
      rgba(10,132,255,.16),
      transparent 35%
    ),
    radial-gradient(
      circle at bottom left,
      rgba(0,122,255,.10),
      transparent 35%
    ),
    #f5f7fb;

  color:#111827;

  padding:18px;

}

.container{

  width:100%;
  max-width:900px;
  margin:0 auto;

}

.header{

  background:
    rgba(255,255,255,.78);

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);

  border:
    1px solid rgba(255,255,255,.9);

  border-radius:28px;

  padding:20px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.07);

  margin-bottom:16px;

}

.header-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

}

.title{

  font-size:23px;

  font-weight:900;

  color:#0A84FF;

}

.subtitle{

  font-size:13px;

  color:#64748b;

  margin-top:5px;

}

.status{

  display:flex;

  align-items:center;

  gap:7px;

  background:
    rgba(34,197,94,.10);

  color:#16a34a;

  border-radius:999px;

  padding:8px 12px;

  font-size:12px;

  font-weight:800;

}

.status-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#22c55e;

}

.controls{

  display:flex;

  gap:10px;

  margin-top:18px;

}

button{

  border:0;

  font-family:inherit;

  cursor:pointer;

  transition:.2s;

}

button:active{

  transform:scale(.97);

}

.refresh{

  flex:1;

  padding:14px;

  border-radius:17px;

  background:#0A84FF;

  color:white;

  font-size:15px;

  font-weight:800;

  box-shadow:
    0 8px 22px rgba(10,132,255,.22);

}

.logout{

  padding:14px 18px;

  border-radius:17px;

  background:
    rgba(255,255,255,.8);

  color:#475569;

  border:
    1px solid rgba(148,163,184,.25);

  font-weight:700;

}

.info{

  background:
    rgba(255,255,255,.72);

  backdrop-filter:blur(20px);

  border-radius:22px;

  padding:18px;

  margin-bottom:16px;

  border:
    1px solid rgba(255,255,255,.9);

}

.info-title{

  font-size:14px;

  font-weight:900;

  margin-bottom:12px;

}

.stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

}

.stat{

  background:
    rgba(248,250,252,.85);

  border-radius:17px;

  padding:14px 8px;

  text-align:center;

}

.stat-number{

  font-size:22px;

  font-weight:900;

}

.stat-label{

  font-size:11px;

  color:#64748b;

  margin-top:4px;

}

#message{

  display:none;

  border-radius:18px;

  padding:15px;

  margin-bottom:16px;

  font-size:13px;

  line-height:1.8;

  font-weight:700;

}

.message-error{

  display:block !important;

  background:
    rgba(239,68,68,.09);

  color:#b91c1c;

  border:
    1px solid rgba(239,68,68,.15);

}

.message-success{

  display:block !important;

  background:
    rgba(34,197,94,.09);

  color:#15803d;

  border:
    1px solid rgba(34,197,94,.15);

}

.message-info{

  display:block !important;

  background:
    rgba(10,132,255,.08);

  color:#075985;

  border:
    1px solid rgba(10,132,255,.15);

}

.loading{

  background:
    rgba(255,255,255,.78);

  border-radius:24px;

  padding:40px 20px;

  text-align:center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.05);

}

.spinner{

  width:38px;
  height:38px;

  border:
    4px solid rgba(10,132,255,.15);

  border-top-color:#0A84FF;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto 15px;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.receipts{

  display:flex;

  flex-direction:column;

  gap:15px;

}

.receipt{

  background:
    rgba(255,255,255,.80);

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);

  border:
    1px solid rgba(255,255,255,.95);

  border-radius:25px;

  padding:18px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.06);

}

.receipt-head{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:10px;

  margin-bottom:15px;

}

.user{

  font-size:18px;

  font-weight:900;

}

.telegram{

  direction:ltr;

  text-align:right;

  color:#64748b;

  font-size:12px;

  margin-top:5px;

}

.pending{

  background:
    rgba(245,158,11,.12);

  color:#b45309;

  padding:7px 10px;

  border-radius:999px;

  font-size:11px;

  font-weight:900;

  white-space:nowrap;

}

.details{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;

  margin-bottom:15px;

}

.detail{

  background:
    rgba(248,250,252,.85);

  border-radius:15px;

  padding:12px;

}

.detail-label{

  font-size:10px;

  color:#64748b;

  margin-bottom:5px;

}

.detail-value{

  font-size:14px;

  font-weight:800;

  word-break:break-word;

}

.amount{

  color:#0A84FF;

  font-size:17px;

}

.actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

}

.approve{

  background:
    linear-gradient(
      135deg,
      #22c55e,
      #16a34a
    );

  color:white;

  padding:14px;

  border-radius:16px;

  font-size:14px;

  font-weight:900;

}

.reject{

  background:
    rgba(239,68,68,.10);

  color:#dc2626;

  padding:14px;

  border-radius:16px;

  font-size:14px;

  font-weight:900;

}

button:disabled{

  opacity:.5;

  cursor:not-allowed;

}

.empty{

  background:
    rgba(255,255,255,.78);

  border-radius:24px;

  padding:45px 20px;

  text-align:center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.05);

}

.empty-icon{

  font-size:45px;

  margin-bottom:10px;

}

.empty-title{

  font-size:17px;

  font-weight:900;

}

.empty-text{

  color:#64748b;

  font-size:13px;

  margin-top:7px;

}

.error-box{

  background:
    rgba(239,68,68,.07);

  color:#991b1b;

  border-radius:22px;

  padding:20px;

  line-height:1.9;

}

.small{

  font-size:11px;

  color:#64748b;

  word-break:break-all;

  margin-top:8px;

}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

  .details{
    grid-template-columns:
      1fr 1fr;
  }

  .title{
    font-size:20px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="header-top">

      <div>

        <div class="title">
          TON Dropy
        </div>

        <div class="subtitle">
          پنل مدیریت پرداخت‌ها و فعال‌سازی کاربران
        </div>

      </div>

      <div class="status">

        <span class="status-dot"></span>

        آنلاین

      </div>

    </div>

    <div class="controls">

      <button
        class="refresh"
        id="refreshButton"
        onclick="loadReceipts()"
      >
        🔄 بروزرسانی رسیدها
      </button>

      <button
        class="logout"
        onclick="logout()"
      >
        خروج
      </button>

    </div>

  </div>


  <div
    id="message"
  ></div>


  <div class="info">

    <div class="info-title">
      وضعیت پرداخت‌ها
    </div>

    <div class="stats">

      <div class="stat">

        <div
          class="stat-number"
          id="totalCount"
        >
          -
        </div>

        <div class="stat-label">
          کل رسیدها
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="pendingCount"
        >
          -
        </div>

        <div class="stat-label">
          در انتظار
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="amountCount"
        >
          -
        </div>

        <div class="stat-label">
          مبلغ انتظار
        </div>

      </div>

    </div>

  </div>


  <div id="content">

    <div class="loading">

      <div class="spinner"></div>

      <div>
        در حال دریافت رسیدها...
      </div>

    </div>

  </div>

</div>


<script>

/*
========================================================
TON DROPY ADMIN PANEL
========================================================

این پنل از API فعلی استفاده می‌کند:

GET
/api/admin/receipts-v2?secret=...

POST
/api/admin/review

بدون تغییر APIهای backend.
========================================================
*/


const params =
  new URLSearchParams(
    window.location.search
  );


const secret =
  params.get("secret") || "";


const API_TIMEOUT =
  15000;


/*
========================================================
UTILITY
========================================================
*/


function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatNumber(value){

  const number =
    Number(value);

  if(
    !Number.isFinite(number)
  ){
    return "0";
  }

  return number.toLocaleString(
    "fa-IR"
  );

}


function formatDate(value){

  if(!value){
    return "-";
  }

  try{

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return value;
    }

    return date.toLocaleString(
      "fa-IR",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return value;

  }

}


function methodLabel(method){

  if(
    method === "full"
  ){
    return "کامل";
  }

  if(
    method === "installment"
  ){
    return "اقساطی";
  }

  return method || "-";

}


/*
========================================================
MESSAGE
========================================================
*/


function showMessage(
  text,
  type="info"
){

  const element =
    document.getElementById(
      "message"
    );

  element.className =
    "";

  element.id =
    "message";

  if(type === "error"){

    element.classList.add(
      "message-error"
    );

  }else if(type === "success"){

    element.classList.add(
      "message-success"
    );

  }else{

    element.classList.add(
      "message-info"
    );

  }

  element.innerHTML =
    text;

}


function hideMessage(){

  const element =
    document.getElementById(
      "message"
    );

  element.className =
    "";

  element.style.display =
    "none";

}


/*
========================================================
FETCH WITH TIMEOUT
========================================================
*/


async function fetchWithTimeout(
  url,
  options={}
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      API_TIMEOUT
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal
        }
      );

    return response;

  }finally{

    clearTimeout(timer);

  }

}


/*
========================================================
LOAD RECEIPTS
========================================================
*/


async function loadReceipts(){

  const content =
    document.getElementById(
      "content"
    );

  const refreshButton =
    document.getElementById(
      "refreshButton"
    );


  if(!secret){

    content.innerHTML = `

      <div class="error-box">

        <strong>
          خطای دسترسی
        </strong>

        <br>

        کلید مدیریت در آدرس صفحه وجود ندارد.

        <div class="small">
          مثال:
          /admin?secret=YOUR_ADMIN_SECRET
        </div>

      </div>

    `;

    showMessage(
      "پارامتر secret در آدرس صفحه وجود ندارد.",
      "error"
    );

    return;

  }


  refreshButton.disabled =
    true;

  refreshButton.innerText =
    "⏳ در حال دریافت...";


  content.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      <div>
        در حال دریافت رسیدها...
      </div>

    </div>

  `;


  try{

    const url =
      "/api/admin/receipts-v2?secret=" +
      encodeURIComponent(
        secret
      );


    const response =
      await fetchWithTimeout(
        url,
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const raw =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(raw);

    }catch{

      throw new Error(
        "پاسخ سرور JSON معتبر نیست."
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        (
          "خطای سرور: HTTP " +
          response.status
        )
      );

    }


    /*
    ----------------------------------------------------
    API ممکن است مستقیماً آرایه برگرداند
    یا داخل data قرار دهد.
    ----------------------------------------------------
    */

    let receipts = [];


    if(
      Array.isArray(data)
    ){

      receipts =
        data;

    }else if(
      data &&
      Array.isArray(data.data)
    ){

      receipts =
        data.data;

    }else if(
      data &&
      Array.isArray(data.receipts)
    ){

      receipts =
        data.receipts;

    }else if(
      data &&
      data.success === false
    ){

      throw new Error(
        data.message ||
        "سرور درخواست را رد کرد."
      );

    }else{

      receipts = [];

    }


    /*
    ----------------------------------------------------
    فقط pending ها
    ----------------------------------------------------
    */

    const pending =
      receipts.filter(
        item =>
          String(
            item.status || ""
          ).toLowerCase()
          === "pending"
      );


    updateStats(
      receipts,
      pending
    );


    renderReceipts(
      pending
    );


    if(
      pending.length > 0
    ){

      showMessage(
        "تعداد " +
        formatNumber(
          pending.length
        ) +
        " رسید در انتظار تأیید است.",
        "success"
      );

    }else{

      showMessage(
        "در حال حاضر رسیدی برای تأیید وجود ندارد.",
        "info"
      );

    }


  }catch(error){

    console.error(
      "ADMIN LOAD ERROR:",
      error
    );


    let message =
      error?.message ||
      "خطای نامشخص";


    if(
      error?.name ===
      "AbortError"
    ){

      message =
        "زمان پاسخ سرور بیشتر از ۱۵ ثانیه شد.";

    }


    content.innerHTML = `

      <div class="error-box">

        <strong>
          دریافت رسیدها ناموفق بود
        </strong>

        <br><br>

        ${escapeHtml(message)}

        <div class="small">
          API:
          /api/admin/receipts-v2
        </div>

        <br>

        <button
          class="refresh"
          onclick="loadReceipts()"
        >
          تلاش مجدد
        </button>

      </div>

    `;


    showMessage(
      "ارتباط با API پنل مدیریت با خطا مواجه شد.",
      "error"
    );


  }finally{

    refreshButton.disabled =
      false;

    refreshButton.innerText =
      "🔄 بروزرسانی رسیدها";

  }

}


/*
========================================================
STATS
========================================================
*/


function updateStats(
  all,
  pending
){

  document.getElementById(
    "totalCount"
  ).innerText =
    formatNumber(
      all.length
    );


  document.getElementById(
    "pendingCount"
  ).innerText =
    formatNumber(
      pending.length
    );


  const total =
    pending.reduce(
      (
        sum,
        item
      ) =>
        sum +
        (
          Number(
            item.amount
          ) || 0
        ),
      0
    );


  document.getElementById(
    "amountCount"
  ).innerText =
    formatNumber(
      total
    );

}


/*
========================================================
RENDER RECEIPTS
========================================================
*/


function renderReceipts(
  receipts
){

  const content =
    document.getElementById(
      "content"
    );


  if(
    !receipts ||
    receipts.length === 0
  ){

    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ✅
        </div>

        <div class="empty-title">
          رسیدی در انتظار تأیید نیست
        </div>

        <div class="empty-text">
          تمام پرداخت‌های فعلی بررسی شده‌اند.
        </div>

      </div>

    `;

    return;

  }


  /*
  جدیدترین رسید اول
  */

  receipts.sort(
    (a,b) =>
      new Date(
        b.created_at || 0
      ) -
      new Date(
        a.created_at || 0
      )
  );


  content.innerHTML = `

    <div class="receipts">

      ${receipts
        .map(
          renderReceipt
        )
        .join("")}

    </div>

  `;

}


/*
========================================================
RECEIPT CARD
========================================================
*/


function renderReceipt(
  item
){

  const user =
    item.users || {};


  const username =
    user.username ||
    item.username ||
    "کاربر";


  const telegramId =
    user.telegram_id ||
    item.telegram_id ||
    "-";


  const amount =
    Number(
      item.amount
    ) || 0;


  return `

    <div
      class="receipt"
      id="receipt-${escapeHtml(item.id)}"
    >

      <div class="receipt-head">

        <div>

          <div class="user">

            👤
            ${escapeHtml(
              username
            )}

          </div>

          <div class="telegram">

            Telegram ID:
            ${escapeHtml(
              telegramId
            )}

          </div>

        </div>


        <div class="pending">

          ⏳ در انتظار

        </div>

      </div>


      <div class="details">


        <div class="detail">

          <div class="detail-label">
            مبلغ
          </div>

          <div
            class="detail-value amount"
          >

            ${formatNumber(
              amount
            )}

            تومان

          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            روش پرداخت
          </div>

          <div class="detail-value">

            ${escapeHtml(
              methodLabel(
                item.method
              )
            )}

          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            تاریخ ثبت
          </div>

          <div class="detail-value">

            ${escapeHtml(
              formatDate(
                item.created_at
              )
            )}

          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            شناسه رسید
          </div>

          <div
            class="detail-value"
            style="font-size:11px"
          >

            ${escapeHtml(
              item.id
            )}

          </div>

        </div>


      </div>


      <div class="actions">

        <button
          class="approve"
          data-receipt-id="${escapeHtml(item.id)}"
          data-user-id="${escapeHtml(item.user_id || "")}"
          onclick="reviewReceipt(
            this,
            'approve'
          )"
        >

          ✅ تأیید پرداخت

        </button>


        <button
          class="reject"
          data-receipt-id="${escapeHtml(item.id)}"
          data-user-id="${escapeHtml(item.user_id || "")}"
          onclick="reviewReceipt(
            this,
            'reject'
          )"
        >

          ❌ رد رسید

        </button>

      </div>


    </div>

  `;

}


/*
========================================================
REVIEW RECEIPT
========================================================
*/


async function reviewReceipt(
  button,
  action
){

  const receiptId =
    button.dataset.receiptId;


  const userId =
    button.dataset.userId;


  if(!receiptId){

    showMessage(
      "شناسه رسید پیدا نشد.",
      "error"
    );

    return;

  }


  let confirmation;


  if(
    action === "approve"
  ){

    confirmation =
      confirm(
        "آیا از تأیید این پرداخت و فعال‌سازی کاربر مطمئن هستید؟"
      );

  }else{

    confirmation =
      confirm(
        "آیا از رد کردن این رسید مطمئن هستید؟"
      );

  }


  if(!confirmation){
    return;
  }


  const card =
    document.getElementById(
      "receipt-" +
      receiptId
    );


  const buttons =
    card
      ? card.querySelectorAll(
          "button"
        )
      : [];


  buttons.forEach(
    btn => {
      btn.disabled =
        true;
    }
  );


  button.innerText =
    action === "approve"
      ? "⏳ در حال تأیید..."
      : "⏳ در حال بررسی...";


  try{

    const response =
      await fetchWithTimeout(
        "/api/admin/review",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify({

              receiptId:
                receiptId,

              userId:
                userId,

              action:
                action,

              secret:
                secret

            })

          }
        }
      );


    const raw =
      await response.text();


    let data = null;


    try{

      data =
        raw
          ? JSON.parse(raw)
          : null;

    }catch{

      data = null;

    }


    if(!response.ok){

      throw new Error(

        data?.message ||
        data?.error ||
        (
          "خطای سرور: HTTP " +
          response.status
        )

      );

    }


    if(
      data &&
      data.success === false
    ){

      throw new Error(
        data.message ||
        "عملیات توسط سرور رد شد."
      );

    }


    /*
    ----------------------------------------------------
    موفقیت
    ----------------------------------------------------
    */


    if(
      action === "approve"
    ){

      showMessage(
        "✅ پرداخت با موفقیت تأیید شد و وضعیت کاربر فعال شد.",
        "success"
      );

    }else{

      showMessage(
        "✅ رسید با موفقیت رد شد.",
        "success"
      );

    }


    /*
    کارت را بلافاصله حذف می‌کنیم
    سپس لیست واقعی سرور را دوباره می‌گیریم.
    */

    if(card){

      card.style.opacity =
        "0";

      card.style.transform =
        "scale(.96)";

      card.style.transition =
        ".25s";

    }


    setTimeout(
      () => {
        loadReceipts();
      },
      350
    );


  }catch(error){

    console.error(
      "REVIEW ERROR:",
      error
    );


    let message =
      error?.message ||
      "خطای نامشخص";


    if(
      error?.name ===
      "AbortError"
    ){

      message =
        "زمان پاسخ عملیات بیشتر از ۱۵ ثانیه شد.";

    }


    showMessage(
      "❌ عملیات انجام نشد: " +
      escapeHtml(
        message
      ),
      "error"
    );


    /*
    دوباره فعال کردن دکمه‌ها
    */

    buttons.forEach(
      btn => {
        btn.disabled =
          false;
      }
    );


    button.innerText =
      action === "approve"
        ? "✅ تأیید پرداخت"
        : "❌ رد رسید";

  }

}


/*
========================================================
LOGOUT
========================================================
*/


function logout(){

  window.location.href =
    "/";

}


/*
========================================================
INITIAL LOAD
========================================================
*/


window.addEventListener(
  "DOMContentLoaded",
  () => {

    loadReceipts();

  }
);


/*
========================================================
AUTO REFRESH
========================================================

هر ۳۰ ثانیه لیست را تازه می‌کند.
========================================================
*/


setInterval(
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      loadReceipts();

    }

  },
  30000
);

</script>
