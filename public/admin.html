<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TON Dropy - پنل مدیریت</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 100% 0%,rgba(10,132,255,.14),transparent 35%),
    radial-gradient(circle at 0% 100%,rgba(10,132,255,.08),transparent 35%),
    #f4f7fc;
  color:#111827;
  padding:12px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

/* HEADER */

.header{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,.95);
  border-radius:28px;
  padding:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.07);
  margin-bottom:15px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.title{
  color:#347ff0;
  font-size:25px;
  font-weight:900;
}

.subtitle{
  color:#64748b;
  font-size:13px;
  margin-top:6px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  background:#eaf8ef;
  color:#16a34a;
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:900;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
}

.refresh{
  flex:1;
  border:0;
  border-radius:17px;
  padding:15px;
  background:#3b82f6;
  color:white;
  font-size:15px;
  font-weight:900;
  box-shadow:0 9px 24px rgba(59,130,246,.25);
}

.refresh:disabled{
  opacity:.65;
}

.logout{
  border:1px solid #e2e8f0;
  border-radius:17px;
  padding:15px 20px;
  background:white;
  color:#475569;
  font-weight:800;
}

/* MESSAGE */

.message{
  display:none;
  border-radius:18px;
  padding:14px 16px;
  margin-bottom:15px;
  font-size:13px;
  line-height:1.8;
  font-weight:800;
}

.message.show{
  display:block;
}

.message.success{
  background:#ecfdf3;
  color:#15803d;
  border:1px solid #bbf7d0;
}

.message.error{
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
}

.message.info{
  background:#eff6ff;
  color:#075985;
  border:1px solid #bfdbfe;
}

/* STATS */

.stats-card{
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.95);
  border-radius:25px;
  padding:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.05);
  margin-bottom:15px;
}

.stats-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f8fafc;
  border-radius:17px;
  padding:14px 7px;
  text-align:center;
}

.stat-number{
  font-size:22px;
  font-weight:900;
}

.stat-label{
  color:#64748b;
  font-size:11px;
  margin-top:5px;
}

/* LOADING */

.loading,
.empty,
.error{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.95);
  border-radius:25px;
  padding:45px 20px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.05);
}

.spinner{
  width:44px;
  height:44px;
  margin:0 auto 17px;
  border-radius:50%;
  border:5px solid #dbeafe;
  border-top-color:#3b82f6;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loading-text{
  font-size:16px;
  font-weight:800;
}

.empty-icon{
  font-size:48px;
  margin-bottom:10px;
}

.empty-title{
  font-size:18px;
  font-weight:900;
}

.empty-text{
  color:#64748b;
  font-size:13px;
  margin-top:8px;
}

.error-title{
  color:#b91c1c;
  font-size:18px;
  font-weight:900;
}

.error-text{
  color:#7f1d1d;
  margin-top:10px;
  font-size:13px;
  line-height:1.9;
  word-break:break-word;
}

/* RECEIPTS */

.receipts{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.receipt{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.95);
  border-radius:25px;
  padding:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
  transition:.25s;
}

.receipt-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:15px;
}

.username{
  font-size:18px;
  font-weight:900;
}

.telegram-id{
  direction:ltr;
  text-align:right;
  color:#64748b;
  font-size:12px;
  margin-top:5px;
}

.pending{
  background:#fff7ed;
  color:#c2410c;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:15px;
}

.detail{
  background:#f8fafc;
  border-radius:15px;
  padding:12px;
}

.detail-label{
  color:#64748b;
  font-size:10px;
  margin-bottom:5px;
}

.detail-value{
  font-size:13px;
  font-weight:800;
  word-break:break-word;
}

.amount{
  color:#1677e8;
  font-size:16px;
}

/* MAIN ACTIONS */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.approve,
.reject,
.block,
.unblock{
  border:0;
  border-radius:16px;
  padding:14px 8px;
  font-size:13px;
  font-weight:900;
}

.approve{
  background:#22c55e;
  color:white;
}

.reject{
  background:#fee2e2;
  color:#dc2626;
}

/* USER CONTROL */

.user-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.block{
  background:#111827;
  color:white;
}

.unblock{
  background:#e0f2fe;
  color:#0369a1;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .title{
    font-size:22px;
  }

  .details{
    grid-template-columns:1fr 1fr;
  }

  .actions,
  .user-controls{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <section class="header">

    <div class="header-top">

      <div>
        <div class="title">
          TON Dropy
        </div>

        <div class="subtitle">
          پنل مدیریت پرداخت‌ها و فعال‌سازی کاربران
        </div>
      </div>

      <div class="online">
        <span class="online-dot"></span>
        آنلاین
      </div>

    </div>

    <div class="controls">

      <button
        id="refreshBtn"
        class="refresh"
        type="button"
        onclick="loadReceipts()"
      >
        🔄 بروزرسانی رسیدها
      </button>

      <button
        class="logout"
        type="button"
        onclick="logout()"
      >
        خروج
      </button>

    </div>

  </section>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- STATS -->

  <section class="stats-card">

    <div class="stats-title">
      وضعیت پرداخت‌ها
    </div>

    <div class="stats">

      <div class="stat">
        <div id="totalCount" class="stat-number">-</div>
        <div class="stat-label">کل رسیدها</div>
      </div>

      <div class="stat">
        <div id="pendingCount" class="stat-number">-</div>
        <div class="stat-label">در انتظار</div>
      </div>

      <div class="stat">
        <div id="pendingAmount" class="stat-number">-</div>
        <div class="stat-label">مبلغ انتظار</div>
      </div>

    </div>

  </section>


  <!-- CONTENT -->

  <main id="content">

    <div class="loading">

      <div class="spinner"></div>

      <div class="loading-text">
        در حال دریافت رسیدها...
      </div>

    </div>

  </main>

</div>


<script>

"use strict";


/* =====================================================
   ADMIN CONFIG
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );

const ADMIN_SECRET =
  urlParams.get("secret") || "";

const API_TIMEOUT = 15000;

let loading = false;


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   NUMBER
===================================================== */

function formatNumber(value){

  const number =
    Number(value);

  if(
    !Number.isFinite(number)
  ){
    return "0";
  }

  return number.toLocaleString("fa-IR");
}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value){
    return "-";
  }

  try{

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return String(value);
    }

    return date.toLocaleString(
      "fa-IR",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return String(value);

  }
}


/* =====================================================
   METHOD
===================================================== */

function methodText(method){

  if(method === "full"){
    return "پرداخت کامل";
  }

  if(method === "installment"){
    return "اقساطی";
  }

  return method || "-";
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  const el =
    document.getElementById(
      "message"
    );

  el.className =
    "message show " +
    (type || "info");

  el.innerHTML =
    text;
}


/* =====================================================
   REQUEST WITH TIMEOUT
===================================================== */

async function request(
  url,
  options
){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      function(){
        controller.abort();
      },
      API_TIMEOUT
    );

  try{

    return await fetch(
      url,
      {
        ...(options || {}),
        signal:
          controller.signal
      }
    );

  }finally{

    clearTimeout(timeout);

  }
}


/* =====================================================
   NORMALIZE API
===================================================== */

function normalizeReceipts(data){

  if(
    Array.isArray(data)
  ){
    return data;
  }

  if(
    data &&
    Array.isArray(data.data)
  ){
    return data.data;
  }

  if(
    data &&
    Array.isArray(data.receipts)
  ){
    return data.receipts;
  }

  return [];
}


/* =====================================================
   PARSE API
===================================================== */

async function parseResponse(response){

  const text =
    await response.text();

  let data = null;

  if(text){

    try{
      data = JSON.parse(text);
    }catch(error){
      data = null;
    }

  }

  if(!response.ok){

    throw new Error(
      (
        data &&
        (
          data.message ||
          data.error
        )
      )
      ||
      text
      ||
      (
        "خطای HTTP " +
        response.status
      )
    );

  }

  return data;
}


/* =====================================================
   STATS
===================================================== */

function updateStats(
  all,
  pending
){

  document.getElementById(
    "totalCount"
  ).innerText =
    formatNumber(
      all.length
    );

  document.getElementById(
    "pendingCount"
  ).innerText =
    formatNumber(
      pending.length
    );

  let amount = 0;

  pending.forEach(
    function(item){

      amount +=
        Number(
          item.amount
        ) || 0;

    }
  );

  document.getElementById(
    "pendingAmount"
  ).innerText =
    formatNumber(amount);
}


/* =====================================================
   LOAD RECEIPTS
===================================================== */

async function loadReceipts(){

  if(loading){
    return;
  }

  loading = true;

  const button =
    document.getElementById(
      "refreshBtn"
    );

  const content =
    document.getElementById(
      "content"
    );


  if(!ADMIN_SECRET){

    content.innerHTML = `
      <div class="error">
        <div class="error-title">
          خطای دسترسی
        </div>

        <div class="error-text">
          secret مدیریت در آدرس صفحه وجود ندارد.
        </div>
      </div>
    `;

    loading = false;

    return;
  }


  button.disabled = true;

  button.innerText =
    "⏳ در حال دریافت...";


  content.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">
        در حال دریافت رسیدها...
      </div>
    </div>
  `;


  try{

    const endpoint =
      "/api/admin/receipts-v2?secret=" +
      encodeURIComponent(
        ADMIN_SECRET
      );


    const response =
      await request(
        endpoint,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    const data =
      await parseResponse(
        response
      );


    const all =
      normalizeReceipts(
        data
      );


    const pending =
      all.filter(
        function(item){

          return String(
            item.status || ""
          ).toLowerCase()
          === "pending";

        }
      );


    updateStats(
      all,
      pending
    );


    renderReceipts(
      pending
    );


    if(pending.length){

      showMessage(
        "✅ " +
        formatNumber(
          pending.length
        ) +
        " رسید در انتظار تأیید وجود دارد.",
        "success"
      );

    }else{

      showMessage(
        "در حال حاضر رسید pending وجود ندارد.",
        "info"
      );

    }


  }catch(error){

    console.error(
      "ADMIN LOAD ERROR:",
      error
    );


    let text =
      error?.message ||
      "خطای نامشخص";


    if(
      error?.name ===
      "AbortError"
    ){

      text =
        "سرور در مدت ۱۵ ثانیه پاسخ نداد.";

    }


    content.innerHTML = `
      <div class="error">

        <div class="error-title">
          دریافت رسیدها ناموفق بود
        </div>

        <div class="error-text">
          ${escapeHtml(text)}

          <br><br>

          <button
            class="refresh"
            onclick="loadReceipts()"
          >
            🔄 تلاش مجدد
          </button>
        </div>

      </div>
    `;


    showMessage(
      "❌ ارتباط با API با خطا مواجه شد.",
      "error"
    );


  }finally{

    loading = false;

    button.disabled = false;

    button.innerText =
      "🔄 بروزرسانی رسیدها";

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderReceipts(receipts){

  const content =
    document.getElementById(
      "content"
    );


  if(
    !receipts ||
    receipts.length === 0
  ){

    content.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ✅
        </div>

        <div class="empty-title">
          رسیدی در انتظار تأیید نیست
        </div>

        <div class="empty-text">
          در حال حاضر رسید pending وجود ندارد.
        </div>

      </div>
    `;

    return;
  }


  const sorted =
    [...receipts].sort(
      function(a,b){

        return (
          new Date(
            b.created_at || 0
          ).getTime()
          -
          new Date(
            a.created_at || 0
          ).getTime()
        );

      }
    );


  content.innerHTML = `
    <div class="receipts">

      ${sorted
        .map(
          function(item){
            return renderReceipt(item);
          }
        )
        .join("")
      }

    </div>
  `;
}


/* =====================================================
   RECEIPT CARD
===================================================== */

function renderReceipt(receipt){

  const user =
    receipt.users &&
    typeof receipt.users === "object"
      ? receipt.users
      : {};


  const username =
    user.username ||
    receipt.username ||
    "کاربر";


  const telegramId =
    user.telegram_id ||
    receipt.telegram_id ||
    "-";


  const amount =
    Number(
      receipt.amount
    ) || 0;


  const receiptId =
    receipt.id ||
    "";


  const userId =
    receipt.user_id ||
    "";


  const currentStatus =
    String(
      user.status ||
      receipt.user_status ||
      "inactive"
    ).toLowerCase();


  const blocked =
    currentStatus ===
    "blocked";


  return `
    <article
      class="receipt"
      id="receipt-${escapeHtml(receiptId)}"
    >

      <div class="receipt-head">

        <div>

          <div class="username">
            👤
            ${escapeHtml(username)}
          </div>

          <div class="telegram-id">
            Telegram ID:
            ${escapeHtml(telegramId)}
          </div>

        </div>

        <div class="pending">
          ⏳ در انتظار
        </div>

      </div>


      <div class="details">

        <div class="detail">

          <div class="detail-label">
            مبلغ
          </div>

          <div class="detail-value amount">
            ${formatNumber(amount)}
            تومان
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            روش پرداخت
          </div>

          <div class="detail-value">
            ${escapeHtml(
              methodText(
                receipt.method
              )
            )}
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            زمان ثبت
          </div>

          <div class="detail-value">
            ${escapeHtml(
              formatDate(
                receipt.created_at
              )
            )}
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            شناسه رسید
          </div>

          <div
            class="detail-value"
            style="font-size:10px"
          >
            ${escapeHtml(receiptId)}
          </div>

        </div>

      </div>


      <!-- PAYMENT -->

      <div class="actions">

        <button
          class="approve"
          type="button"

          data-receipt-id="${escapeHtml(receiptId)}"
          data-user-id="${escapeHtml(userId)}"

          onclick="
            reviewReceipt(
              this,
              'approve'
            )
          "
        >
          ✅ تأیید پرداخت
        </button>


        <button
          class="reject"
          type="button"

          data-receipt-id="${escapeHtml(receiptId)}"
          data-user-id="${escapeHtml(userId)}"

          onclick="
            reviewReceipt(
              this,
              'reject'
            )
          "
        >
          ❌ رد رسید
        </button>

      </div>


      <!-- USER CONTROL -->

      <div class="user-controls">

        <button
          class="block"
          type="button"

          data-user-id="${escapeHtml(userId)}"
          data-telegram-id="${escapeHtml(telegramId)}"

          onclick="
            changeUserStatus(
              this,
              'block'
            )
          "
        >
          🚫 مسدودی کاربر
        </button>


        <button
          class="unblock"
          type="button"

          data-user-id="${escapeHtml(userId)}"
          data-telegram-id="${escapeHtml(telegramId)}"

          onclick="
            changeUserStatus(
              this,
              'unblock'
            )
          "
        >
          🔓 رفع مسدودی
        </button>

      </div>

    </article>
  `;
}


/* =====================================================
   PAYMENT REVIEW
===================================================== */

async function reviewReceipt(
  button,
  action
){

  const receiptId =
    button?.dataset?.receiptId || "";

  const userId =
    button?.dataset?.userId || "";


  if(!receiptId){

    showMessage(
      "❌ شناسه رسید پیدا نشد.",
      "error"
    );

    return;
  }


  const approve =
    action === "approve";


  const question =
    approve
      ? "آیا از تأیید پرداخت و فعال‌سازی حساب کاربر مطمئن هستید؟"
      : "آیا از رد رسید مطمئن هستید؟";


  if(
    !window.confirm(
      question
    )
  ){

    return;
  }


  const card =
    document.getElementById(
      "receipt-" +
      receiptId
    );


  const buttons =
    card
      ? card.querySelectorAll("button")
      : [button];


  buttons.forEach(
    function(btn){
      btn.disabled = true;
    }
  );


  button.innerText =
    approve
      ? "⏳ در حال تأیید..."
      : "⏳ در حال رد...";


  try{

    const payload = {

      receiptId:
        receiptId,

      receipt_id:
        receiptId,

      id:
        receiptId,

      userId:
        userId,

      user_id:
        userId,

      action:
        action,

      status:
        approve
          ? "approved"
          : "rejected",

      decision:
        approve
          ? "approved"
          : "rejected",

      approved:
        approve,

      secret:
        ADMIN_SECRET,

      admin_secret:
        ADMIN_SECRET

    };


    const response =
      await request(
        "/api/admin/review",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const text =
      await response.text();


    let data = null;


    try{
      data =
        text
          ? JSON.parse(text)
          : null;
    }catch(error){
      data = null;
    }


    if(!response.ok){

      throw new Error(
        data?.message ||
        data?.error ||
        text ||
        (
          "HTTP " +
          response.status
        )
      );

    }


    if(
      data &&
      data.success === false
    ){

      throw new Error(
        data.message ||
        data.error ||
        "عملیات توسط سرور رد شد."
      );

    }


    showMessage(
      approve
        ? "✅ پرداخت تأیید شد؛ حساب کاربر باید فعال شود."
        : "✅ رسید رد شد؛ کاربر می‌تواند دوباره تراکنش انجام دهد.",
      "success"
    );


    await loadReceipts();


  }catch(error){

    console.error(
      "REVIEW ERROR:",
      error
    );


    showMessage(
      "❌ عملیات انجام نشد: " +
      escapeHtml(
        error?.message ||
        "خطای نامشخص"
      ),
      "error"
    );


    buttons.forEach(
      function(btn){
        btn.disabled = false;
      }
    );


    button.innerText =
      approve
        ? "✅ تأیید پرداخت"
        : "❌ رد رسید";

  }

}


/* =====================================================
   BLOCK / UNBLOCK USER
===================================================== */

async function changeUserStatus(
  button,
  action
){

  const userId =
    button?.dataset?.userId || "";

  const telegramId =
    button?.dataset?.telegramId || "";


  if(
    !userId &&
    !telegramId
  ){

    showMessage(
      "❌ شناسه کاربر پیدا نشد.",
      "error"
    );

    return;
  }


  const blocking =
    action === "block";


  const question =
    blocking
      ? "آیا می‌خواهید این کاربر مسدود شود؟\n\nکاربر پس از ورود به Mini App باید پیام «حساب شما مسدود شده است» را ببیند."
      : "آیا می‌خواهید مسدودی این کاربر برداشته شود؟";


  if(
    !window.confirm(
      question
    )
  ){

    return;
  }


  const card =
    button.closest(
      ".receipt"
    );


  const buttons =
    card
      ? card.querySelectorAll("button")
      : [button];


  buttons.forEach(
    function(btn){
      btn.disabled = true;
    }
  );


  button.innerText =
    blocking
      ? "⏳ در حال مسدودسازی..."
      : "⏳ در حال رفع مسدودی...";


  try{

    /*
    --------------------------------------------------
    action:
      block
      unblock

    status:
      blocked
      active

    --------------------------------------------------
    */

    const payload = {

      action:
        action,

      status:
        blocking
          ? "blocked"
          : "active",

      userId:
        userId,

      user_id:
        userId,

      telegramId:
        telegramId,

      telegram_id:
        telegramId,

      secret:
        ADMIN_SECRET,

      admin_secret:
        ADMIN_SECRET

    };


    console.log(
      "USER STATUS REQUEST:",
      payload
    );


    const response =
      await request(
        "/api/admin/review",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const text =
      await response.text();


    let data = null;


    try{

      data =
        text
          ? JSON.parse(text)
          : null;

    }catch(error){

      data = null;

    }


    if(!response.ok){

      throw new Error(
        data?.message ||
        data?.error ||
        text ||
        (
          "HTTP " +
          response.status
        )
      );

    }


    if(
      data &&
      data.success === false
    ){

      throw new Error(
        data.message ||
        data.error ||
        "عملیات توسط سرور رد شد."
      );

    }


    showMessage(
      blocking
        ? "🚫 کاربر مسدود شد."
        : "🔓 مسدودی کاربر برداشته شد.",
      "success"
    );


    await loadReceipts();


  }catch(error){

    console.error(
      "USER STATUS ERROR:",
      error
    );


    showMessage(
      "❌ تغییر وضعیت کاربر انجام نشد: " +
      escapeHtml(
        error?.message ||
        "خطای نامشخص"
      ),
      "error"
    );


    buttons.forEach(
      function(btn){
        btn.disabled = false;
      }
    );


    button.innerText =
      blocking
        ? "🚫 مسدودی کاربر"
        : "🔓 رفع مسدودی";

  }

}
