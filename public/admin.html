<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
TON Dropy - مدیریت پرداخت‌ها
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 15px;

  background:
    linear-gradient(
      135deg,
      #f4f8ff,
      #eef4ff
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color: #111827;
}

.container {

  max-width: 950px;

  margin: auto;
}

.header {

  background:
    rgba(255,255,255,.94);

  border-radius: 25px;

  padding: 22px;

  margin-bottom: 16px;

  box-shadow:
    0 12px 40px
    rgba(30,80,150,.08);

  border:
    1px solid
    rgba(255,255,255,.8);
}

.title {

  font-size: 27px;

  font-weight: 950;

  color: #2878ed;
}

.subtitle {

  color: #64748b;

  margin-top: 7px;

  font-size: 14px;
}

.refresh {

  width: 100%;

  margin-top: 18px;

  border: 0;

  border-radius: 15px;

  padding: 14px;

  background:
    linear-gradient(
      135deg,
      #2878ed,
      #1260d8
    );

  color: white;

  font-size: 15px;

  font-weight: 900;

  cursor: pointer;
}

.status {

  background:
    #eff6ff;

  color:
    #075985;

  border-radius:
    15px;

  padding:
    13px;

  margin-bottom:
    15px;

  font-weight:
    700;
}

.status.error {

  background:
    #fef2f2;

  color:
    #b91c1c;
}

.card {

  background:
    rgba(255,255,255,.96);

  border-radius:
    22px;

  padding:
    18px;

  margin-bottom:
    15px;

  box-shadow:
    0 10px 35px
    rgba(30,80,150,.07);

  border:
    1px solid
    #e5e7eb;
}

.receipt-header {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    10px;

  margin-bottom:
    14px;
}

.receipt-title {

  font-size:
    18px;

  font-weight:
    950;
}

.badge {

  padding:
    7px 11px;

  border-radius:
    999px;

  font-size:
    12px;

  font-weight:
    900;
}

.badge.pending {

  background:
    #fff7ed;

  color:
    #c2410c;
}

.badge.approved {

  background:
    #dcfce7;

  color:
    #15803d;
}

.badge.rejected {

  background:
    #fee2e2;

  color:
    #b91c1c;
}

.user-box {

  background:
    #f8fafc;

  border-radius:
    17px;

  padding:
    14px;

  margin-bottom:
    14px;

  border:
    1px solid
    #e2e8f0;
}

.user-name {

  font-size:
    17px;

  font-weight:
    950;

  margin-bottom:
    8px;
}

.user-row {

  display:
    flex;

  justify-content:
    space-between;

  gap:
    10px;

  padding:
    5px 0;
}

.label {

  color:
    #64748b;

  font-size:
    12px;
}

.value {

  font-weight:
    800;

  word-break:
    break-word;
}

.amount {

  font-size:
    22px;

  font-weight:
    950;

  color:
    #111827;
}

.receipt-image-box {

  margin-top:
    15px;

  background:
    #f8fafc;

  border-radius:
    18px;

  padding:
    10px;

  text-align:
    center;

  border:
    1px solid
    #e2e8f0;
}

.receipt-image-title {

  text-align:
    right;

  font-size:
    13px;

  font-weight:
    900;

  color:
    #475569;

  padding:
    4px 5px 10px;
}

.receipt-image {

  display:
    block;

  width:
    100%;

  max-height:
    520px;

  object-fit:
    contain;

  border-radius:
    13px;

  background:
    white;

  cursor:
    zoom-in;
}

.no-image {

  padding:
    35px 10px;

  color:
    #94a3b8;

  font-size:
    14px;
}

.actions {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  margin-top:
    17px;
}

.actions button {

  border:
    0;

  border-radius:
    15px;

  padding:
    14px;

  font-weight:
    950;

  font-size:
    15px;

  cursor:
    pointer;
}

.approve {

  background:
    #22c55e;

  color:
    white;
}

.reject {

  background:
    #fee2e2;

  color:
    #dc2626;
}

.empty {

  text-align:
    center;

  padding:
    45px 20px;

  color:
    #64748b;
}

.modal {

  position:
    fixed;

  inset:
    0;

  background:
    rgba(0,0,0,.82);

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    15px;

  z-index:
    9999;
}

.modal.show {

  display:
    flex;
}

.modal img {

  max-width:
    100%;

  max-height:
    92vh;

  object-fit:
    contain;

  border-radius:
    14px;

  background:
    white;
}

.close {

  position:
    fixed;

  top:
    15px;

  left:
    15px;

  width:
    45px;

  height:
    45px;

  border:
    0;

  border-radius:
    50%;

  background:
    white;

  color:
    #111827;

  font-size:
    25px;

  font-weight:
    900;

  cursor:
    pointer;
}

@media (max-width:600px) {

  body {
    padding: 10px;
  }

  .card {
    padding: 14px;
  }

  .actions {
    grid-template-columns:
      1fr;
  }

  .receipt-image {
    max-height:
      450px;
  }

}

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <div class="title">
      TON Dropy
    </div>

    <div class="subtitle">
      پنل مدیریت پرداخت‌ها و فعال‌سازی کاربران
    </div>

    <button
      class="refresh"
      onclick="loadReceipts()"
    >
      🔄 بروزرسانی رسیدها
    </button>

  </div>


  <div
    id="message"
    class="status"
  >
    در حال دریافت اطلاعات...
  </div>


  <div
    id="content"
  ></div>

</div>


<!-- IMAGE MODAL -->

<div
  id="imageModal"
  class="modal"
  onclick="closeImage()"
>

  <button
    class="close"
    onclick="closeImage()"
  >
    ×
  </button>

  <img
    id="modalImage"
    src=""
    alt="رسید پرداخت"
    onclick="event.stopPropagation()"
  >

</div>


<script>

"use strict";


/*
=========================================================
ADMIN SECRET
=========================================================
*/

const params =
  new URLSearchParams(
    location.search
  );


let adminSecret =
  params.get("secret") ||
  localStorage.getItem(
    "tondropy_admin_secret"
  );


if (!adminSecret) {

  adminSecret =
    prompt(
      "رمز پنل مدیریت را وارد کنید:"
    );


  if (adminSecret) {

    localStorage.setItem(
      "tondropy_admin_secret",
      adminSecret
    );

  }

}


/*
=========================================================
MESSAGE
=========================================================
*/

function message(
  text,
  error = false
) {

  const el =
    document.getElementById(
      "message"
    );


  el.innerText =
    text;


  el.className =
    error
      ? "status error"
      : "status";

}


/*
=========================================================
NUMBER
=========================================================
*/

function number(
  value
) {

  const n =
    Number(value);


  return Number.isFinite(n)
    ? n.toLocaleString(
        "fa-IR"
      )
    : "-";

}


/*
=========================================================
DATE
=========================================================
*/

function date(
  value
) {

  if (!value) {
    return "-";
  }


  try {

    return new Date(
      value
    ).toLocaleString(
      "fa-IR"
    );

  } catch (_) {

    return value;

  }

}


/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
=========================================================
IMAGE URL
=========================================================
*/

function getImageSource(
  receipt
) {

  const image =
    receipt.image_data;


  if (!image) {
    return "";
  }


  /*
   * اگر image_data خودش Data URL باشد
   */

  if (
    typeof image === "string" &&
    image.startsWith("data:")
  ) {

    return image;

  }


  /*
   * اگر Base64 خام باشد
   */

  if (
    typeof image === "string"
  ) {

    const clean =
      image.replace(
        /^data:image\/[^;]+;base64,/,
        ""
      );


    if (
      clean.length > 100
    ) {

      return
        "data:image/jpeg;base64," +
        clean;

    }

  }


  return "";

}


/*
=========================================================
LOAD RECEIPTS
=========================================================
*/

async function loadReceipts() {

  if (!adminSecret) {

    message(
      "رمز مدیریت وارد نشده است.",
      true
    );

    return;

  }


  message(
    "در حال دریافت رسیدها..."
  );


  try {

    const response =
      await fetch(
        "/api/admin/receipts-v2",
        {

          headers: {

            "x-admin-secret":
              adminSecret

          }

        }
      );


    const data =
      await response.json();


    if (
      response.status ===
      401
    ) {

      localStorage.removeItem(
        "tondropy_admin_secret"
      );


      throw new Error(
        "رمز مدیریت صحیح نیست."
      );

    }


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "خطا در دریافت اطلاعات."
      );

    }


    render(
      data.receipts || []
    );


    message(
      `تعداد رسیدها: ${
        (data.receipts || [])
          .length
      }`
    );


  } catch (error) {

    message(
      error.message ||
      "خطا در دریافت رسیدها.",
      true
    );

  }

}


/*
=========================================================
RENDER
=========================================================
*/

function render(
  receipts
) {

  const content =
    document.getElementById(
      "content"
    );


  if (
    !receipts.length
  ) {

    content.innerHTML = `

      <div class="card empty">

        هنوز رسیدی ثبت نشده است.

      </div>

    `;

    return;

  }


  content.innerHTML =
    receipts
      .map(
        receipt => {

          const pending =
            receipt.status ===
            "pending";


          const image =
            getImageSource(
              receipt
            );


          const fullName =
            [
              receipt.first_name,
              receipt.last_name
            ]
            .filter(Boolean)
            .join(" ");


          const username =
            receipt.username
              ? "@" +
                receipt.username
              : "-";


          const statusClass =
            receipt.status ===
            "approved"

              ? "approved"

              : receipt.status ===
                "rejected"

                ? "rejected"

                : "pending";


          const statusText =
            receipt.status ===
            "approved"

              ? "تأیید شده"

              : receipt.status ===
                "rejected"

                ? "رد شده"

                : "در انتظار بررسی";


          return `

            <div class="card receipt">

              <div class="receipt-header">

                <div class="receipt-title">
                  🧾 رسید پرداخت
                </div>

                <div
                  class="badge ${statusClass}"
                >
                  ${statusText}
                </div>

              </div>


              <div class="user-box">

                <div class="user-name">

                  👤

                  ${
                    escapeHtml(
                      fullName ||
                      "کاربر TON Dropy"
                    )
                  }

                </div>


                <div class="user-row">

                  <span class="label">
                    Telegram ID
                  </span>

                  <span class="value">
                    ${
                      escapeHtml(
                        receipt.telegram_id ||
                        "-"
                      )
                    }
                  </span>

                </div>


                <div class="user-row">

                  <span class="label">
                    Username
                  </span>

                  <span class="value">
                    ${
                      escapeHtml(
                        username
                      )
                    }
                  </span>

                </div>

              </div>


              <div class="user-row">

                <span class="label">
                  مبلغ پرداخت
                </span>

                <span class="amount">
                  ${
                    number(
                      receipt.amount
                    )
                  }
                </span>

              </div>


              <div class="user-row">

                <span class="label">
                  وضعیت
                </span>

                <span class="value">
                  ${
                    escapeHtml(
                      statusText
                    )
                  }
                </span>

              </div>


              <div class="user-row">

                <span class="label">
                  تاریخ ثبت
                </span>

                <span class="value">
                  ${
                    date(
                      receipt.created_at
                    )
                  }
                </span>

              </div>


              <div class="receipt-image-box">

                <div class="receipt-image-title">
                  📷 تصویر رسید پرداخت
                </div>

                ${
                  image

                    ? `

                      <img
                        class="receipt-image"
                        src="${image}"
                        alt="رسید پرداخت"
                        onclick="openImage(this.src)"
                      >

                    `

                    : `

                      <div class="no-image">
                        تصویر رسید در اطلاعات این رکورد وجود ندارد.
                      </div>

                    `
                }

              </div>


              ${
                pending

                  ? `

                    <div class="actions">

                      <button
                        class="approve"
                        onclick="review(
                          '${escapeHtml(receipt.id)}',
                          'approved'
                        )"
                      >
                        ✅ تأیید پرداخت
                      </button>


                      <button
                        class="reject"
                        onclick="review(
                          '${escapeHtml(receipt.id)}',
                          'rejected'
                        )"
                      >
                        ❌ رد پرداخت
                      </button>

                    </div>

                  `

                  : ""

              }

            </div>

          `;

        }
      )
      .join("");

}


/*
=========================================================
REVIEW
=========================================================
*/

async function review(
  receiptId,
  status
) {

  const text =
    status ===
    "approved"
      ? "تأیید"
      : "رد";


  if (
    !confirm(
      `آیا از ${text} این رسید مطمئن هستید؟`
    )
  ) {

    return;

  }


  try {

    message(
      "در حال ثبت نتیجه..."
    );


    const response =
      await fetch(
        "/api/admin/review",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-admin-secret":
              adminSecret

          },

          body:
            JSON.stringify({

              receiptId,

              status

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "عملیات ناموفق بود."
      );

    }


    message(

      status ===
      "approved"

        ? "پرداخت تأیید شد و حساب کاربر فعال شد. ✅"

        : "پرداخت رد شد. ❌"

    );


    await loadReceipts();


  } catch (error) {

    message(

      error.message ||
      "خطا در انجام عملیات.",

      true

    );

  }

}


/*
=========================================================
IMAGE MODAL
=========================================================
*/

function openImage(
  src
) {

  const modal =
    document.getElementById(
      "imageModal"
    );


  const image =
    document.getElementById(
      "modalImage"
    );


  image.src =
    src;


  modal.classList.add(
    "show"
  );

}


function closeImage() {

  const modal =
    document.getElementById(
      "imageModal"
    );


  modal.classList.remove(
    "show"
  );


  document.getElementById(
    "modalImage"
  ).src = "";

}


/*
=========================================================
START
=========================================================
*/

loadReceipts();

</script>

</body>

</html>
