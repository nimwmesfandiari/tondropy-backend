<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>TON Dropy - مدیریت</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #f4f7fc;
  font-family: Arial, sans-serif;
  color: #111827;
}

.container {
  max-width: 900px;
  margin: auto;
}

.header,
.card {
  background: white;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow:
    0 10px 35px rgba(0,0,0,.06);
}

.title {
  font-size: 25px;
  font-weight: 900;
  color: #347ff0;
}

.subtitle {
  color: #64748b;
  margin-top: 6px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 13px 18px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
}

.refresh {
  background: #347ff0;
  color: white;
  margin-top: 18px;
  width: 100%;
}

.receipt {
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 16px;
  margin-top: 12px;
}

.row {
  margin: 7px 0;
}

.label {
  color: #64748b;
  font-size: 12px;
}

.value {
  font-weight: 800;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.approve {
  background: #22c55e;
  color: white;
}

.reject {
  background: #fee2e2;
  color: #dc2626;
}

.status {
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 15px;
  background: #eff6ff;
  color: #075985;
}

.error {
  background: #fef2f2;
  color: #b91c1c;
}

.empty {
  text-align: center;
  padding: 35px;
  color: #64748b;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="title">
      TON Dropy
    </div>

    <div class="subtitle">
      پنل مدیریت پرداخت‌ها و فعال‌سازی کاربران
    </div>

    <button
      class="refresh"
      onclick="loadReceipts()"
    >
      🔄 بروزرسانی رسیدها
    </button>

  </div>

  <div
    id="message"
    class="status"
  >
    در حال دریافت اطلاعات...
  </div>

  <div id="content"></div>

</div>


<script>

"use strict";


/*
=========================================================
ADMIN SECRET
=========================================================
*/

const params =
  new URLSearchParams(
    location.search
  );

let adminSecret =
  params.get("secret") ||
  localStorage.getItem(
    "tondropy_admin_secret"
  );

if (!adminSecret) {

  adminSecret =
    prompt(
      "رمز پنل مدیریت را وارد کنید:"
    );

  if (adminSecret) {

    localStorage.setItem(
      "tondropy_admin_secret",
      adminSecret
    );

  }

}


/*
=========================================================
MESSAGE
=========================================================
*/

function message(
  text,
  error = false
) {

  const el =
    document.getElementById(
      "message"
    );

  el.innerText =
    text;

  el.className =
    error
      ? "status error"
      : "status";

}


/*
=========================================================
FORMAT
=========================================================
*/

function number(
  value
) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n.toLocaleString(
        "fa-IR"
      )
    : "-";

}


function date(
  value
) {

  if (!value) {
    return "-";
  }

  try {

    return new Date(
      value
    ).toLocaleString(
      "fa-IR"
    );

  } catch (_) {

    return value;

  }

}


/*
=========================================================
ESCAPE
=========================================================
*/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/*
=========================================================
LOAD
=========================================================
*/

async function loadReceipts() {

  if (!adminSecret) {

    message(
      "رمز مدیریت وارد نشده است.",
      true
    );

    return;

  }

  message(
    "در حال دریافت رسیدها..."
  );

  try {

    const response =
      await fetch(
        "/api/admin/receipts-v2",
        {
          headers: {
            "x-admin-secret":
              adminSecret
          }
        }
      );

    const data =
      await response.json();

    if (
      response.status ===
      401
    ) {

      localStorage.removeItem(
        "tondropy_admin_secret"
      );

      throw new Error(
        "رمز مدیریت صحیح نیست."
      );

    }

    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "خطا در دریافت اطلاعات."
      );

    }

    render(
      data.receipts ||
      []
    );

    message(
      `تعداد رسیدها: ${
        (data.receipts || [])
          .length
      }`
    );

  } catch (error) {

    message(
      error.message ||
      "ارتباط با API برقرار نشد.",
      true
    );

  }

}


/*
=========================================================
RENDER
=========================================================
*/

function render(
  receipts
) {

  const content =
    document.getElementById(
      "content"
    );

  if (!receipts.length) {

    content.innerHTML =
      `
      <div class="card empty">
        هنوز رسیدی ثبت نشده است.
      </div>
      `;

    return;

  }

  content.innerHTML =
    receipts
      .map(
        receipt => {

          const pending =
            receipt.status ===
            "pending";

          return `
            <div class="card receipt">

              <div class="row">
                <div class="label">
                  Telegram ID
                </div>

                <div class="value">
                  ${escapeHtml(
                    receipt.telegram_id
                  )}
                </div>
              </div>

              <div class="row">
                <div class="label">
                  Username
                </div>

                <div class="value">
                  ${
                    receipt.username
                      ? "@" +
                        escapeHtml(
                          receipt.username
                        )
                      : "-"
                  }
                </div>
              </div>

              <div class="row">
                <div class="label">
                  مبلغ
                </div>

                <div class="value">
                  ${number(
                    receipt.amount
                  )}
                </div>
              </div>

              <div class="row">
                <div class="label">
                  وضعیت
                </div>

                <div class="value">
                  ${escapeHtml(
                    receipt.status
                  )}
                </div>
              </div>

              <div class="row">
                <div class="label">
                  تاریخ
                </div>

                <div class="value">
                  ${date(
                    receipt.created_at
                  )}
                </div>
              </div>

              ${
                pending
                  ? `
                    <div class="actions">

                      <button
                        class="approve"
                        onclick="review('${escapeHtml(
                          receipt.id
                        )}','approved')"
                      >
                        ✅ تایید
                      </button>

                      <button
                        class="reject"
                        onclick="review('${escapeHtml(
                          receipt.id
                        )}','rejected')"
                      >
                        ❌ رد
                      </button>

                    </div>
                  `
                  : ""
              }

            </div>
          `;

        }
      )
      .join("");

}


/*
=========================================================
REVIEW
=========================================================
*/

async function review(
  receiptId,
  status
) {

  const text =
    status ===
    "approved"
      ? "تایید"
      : "رد";

  if (
    !confirm(
      `آیا از ${text} این رسید مطمئن هستید؟`
    )
  ) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/admin/review",
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json",

            "x-admin-secret":
              adminSecret
          },

          body:
            JSON.stringify({
              receiptId,
              status
            })
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "عملیات ناموفق بود."
      );

    }

    message(
      status ===
      "approved"
        ? "رسید تایید و حساب کاربر فعال شد. ✅"
        : "رسید رد شد. ❌"
    );

    await loadReceipts();

  } catch (error) {

    message(
      error.message ||
      "خطا در انجام عملیات.",
      true
    );

  }

}


/*
=========================================================
START
=========================================================
*/

loadReceipts();

</script>

</body>

</html>
