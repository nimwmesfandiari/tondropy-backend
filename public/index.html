<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>TON Dropy</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;
  background:
    radial-gradient(
      circle at top right,
      rgba(10,132,255,.15),
      transparent 35%
    ),
    #f5f8fc;
  font-family: Vazirmatn, sans-serif;
}

.card {
  width: 100%;
  max-width: 420px;
  margin: auto;
  padding: 24px;
  background: rgba(255,255,255,.88);
  border: 1px solid white;
  border-radius: 28px;
  box-shadow:
    0 20px 50px rgba(0,0,0,.08);
  backdrop-filter: blur(25px);
}

.title {
  text-align: center;
  color: #0a84ff;
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-bottom: 24px;
}

.hidden {
  display: none !important;
}

.methods {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.method {
  border: 2px solid #e5e7eb;
  background: white;
  border-radius: 17px;
  padding: 14px 8px;
  text-align: center;
  font-weight: 800;
  cursor: pointer;
}

.method.active {
  border-color: #0a84ff;
  background: #eff6ff;
  color: #0a84ff;
}

.upload {
  border: 2px dashed #0a84ff;
  border-radius: 18px;
  padding: 22px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 16px;
  background: #f8fbff;
}

.upload strong {
  display: block;
  color: #0a84ff;
}

#fileName {
  margin-top: 8px;
  font-size: 12px;
  color: #64748b;
}

input[type=file] {
  display: none;
}

button {
  width: 100%;
  border: 0;
  border-radius: 17px;
  padding: 16px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
}

.send {
  background: #22c55e;
  color: white;
}

.status {
  margin-top: 16px;
  padding: 15px;
  border-radius: 16px;
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
}

.info {
  background: #eff6ff;
  color: #075985;
}

.success {
  background: #ecfdf5;
  color: #15803d;
}

.error {
  background: #fef2f2;
  color: #b91c1c;
}

.user {
  text-align: center;
  margin-bottom: 18px;
  font-weight: 900;
}

</style>

</head>

<body>

<div class="card">

  <div class="title">
    TON Dropy
  </div>

  <div class="subtitle">
    فعال‌سازی حساب کاربری
  </div>

  <div
    id="loading"
    class="status info"
  >
    در حال بررسی حساب تلگرام...
  </div>

  <div
    id="error"
    class="status error hidden"
  ></div>

  <div
    id="active"
    class="status success hidden"
  >
    حساب شما قبلاً فعال شده است. ✅
  </div>

  <div
    id="pending"
    class="status info hidden"
  >
    رسید شما قبلاً ارسال شده و در انتظار بررسی مدیریت است. ⏳
  </div>

  <div
    id="form"
    class="hidden"
  >

    <div
      id="user"
      class="user"
    ></div>

    <div class="methods">

      <div
        id="full"
        class="method active"
        onclick="setMethod('full')"
      >
        پرداخت کامل
        <br>
        ۳,۷۸۰,۰۰۰
      </div>

      <div
        id="installment"
        class="method"
        onclick="setMethod('installment')"
      >
        اقساطی
        <br>
        ۹۴۵,۰۰۰
      </div>

    </div>

    <label class="upload">

      <strong>
        📎 انتخاب تصویر رسید
      </strong>

      <div id="fileName">
        فایلی انتخاب نشده
      </div>

      <input
        id="receipt"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        onchange="fileSelected()"
      >

    </label>

    <button
      class="send"
      onclick="uploadReceipt()"
    >
      ارسال رسید
    </button>

    <div
      id="message"
      class="status hidden"
    ></div>

  </div>

</div>


<script>

"use strict";

let telegramUser = null;

let method = "full";

let telegramId = "";

let username = "";


/*
=========================================================
TELEGRAM
=========================================================
*/

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


function show(
  id
) {

  document
    .getElementById(id)
    .classList.remove(
      "hidden"
    );

}


function hide(
  id
) {

  document
    .getElementById(id)
    .classList.add(
      "hidden"
    );

}


function message(
  text,
  type = "info"
) {

  const el =
    document.getElementById(
      "message"
    );

  el.className =
    `status ${type}`;

  el.innerText =
    text;

  el.classList.remove(
    "hidden"
  );

}


/*
=========================================================
AUTH
=========================================================
*/

async function authenticate() {

  if (!tg) {

    hide("loading");

    const error =
      document.getElementById(
        "error"
      );

    error.innerText =
      "لطفاً Mini App را از داخل Telegram باز کنید.";

    show("error");

    return;

  }

  tg.ready();

  tg.expand();

  const initData =
    tg.initData;

  if (!initData) {

    hide("loading");

    const error =
      document.getElementById(
        "error"
      );

    error.innerText =
      "اطلاعات Telegram دریافت نشد. لطفاً Mini App را از داخل ربات باز کنید.";

    show("error");

    return;

  }

  try {

    const response =
      await fetch(
        "/api/auth/telegram",
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              initData
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok ||
        !data.success) {

      throw new Error(
        data.error ||
        "خطا در احراز هویت."
      );

    }

    telegramUser =
      data.user;

    telegramId =
      String(
        data.telegram_id
      );

    username =
      data.username ||
      "";

    const name =
      [
        telegramUser?.first_name,
        telegramUser?.last_name
      ]
      .filter(Boolean)
      .join(" ");

    document.getElementById(
      "user"
    ).innerText =
      name
        ? `سلام ${name} عزیز 👋`
        : "سلام 👋";

    hide("loading");

    const status =
      data.account_status;

    if (
      status === "active"
    ) {

      show("active");

      return;

    }

    if (
      status === "pending"
    ) {

      show("pending");

      return;

    }

    show("form");

  } catch (error) {

    hide("loading");

    const errorBox =
      document.getElementById(
        "error"
      );

    errorBox.innerText =
      error.message ||
      "خطا در ارتباط با سرور.";

    show("error");

  }

}


/*
=========================================================
PAYMENT METHOD
=========================================================
*/

function setMethod(
  selected
) {

  method =
    selected;

  document
    .getElementById(
      "full"
    )
    .classList.toggle(
      "active",
      selected === "full"
    );

  document
    .getElementById(
      "installment"
    )
    .classList.toggle(
      "active",
      selected === "installment"
    );

}


/*
=========================================================
FILE
=========================================================
*/

function fileSelected() {

  const input =
    document.getElementById(
      "receipt"
    );

  const file =
    input.files[0];

  document.getElementById(
    "fileName"
  ).innerText =
    file
      ? file.name
      : "فایلی انتخاب نشده";

}


/*
=========================================================
IMAGE COMPRESS
=========================================================
*/

function compressImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          const image =
            new Image();

          image.onload =
            function() {

              const max =
                1600;

              let width =
                image.width;

              let height =
                image.height;

              if (
                width > max ||
                height > max
              ) {

                if (
                  width >
                  height
                ) {

                  height =
                    Math.round(
                      height *
                      max /
                      width
                    );

                  width =
                    max;

                } else {

                  width =
                    Math.round(
                      width *
                      max /
                      height
                    );

                  height =
                    max;

                }

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );

              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.82
                )
              );

            };

          image.onerror =
            reject;

          image.src =
            event.target.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/*
=========================================================
UPLOAD
=========================================================
*/

async function uploadReceipt() {

  const input =
    document.getElementById(
      "receipt"
    );

  const file =
    input.files[0];

  if (!file) {

    message(
      "لطفاً ابتدا تصویر رسید را انتخاب کنید.",
      "error"
    );

    return;

  }

  if (!telegramId) {

    message(
      "شناسه Telegram دریافت نشده است.",
      "error"
    );

    return;

  }

  message(
    "در حال آماده‌سازی و ارسال رسید...",
    "info"
  );

  try {

    const imageData =
      await compressImage(
        file
      );

    const amount =
      method === "full"
        ? 3780000
        : 945000;

    const response =
      await fetch(
        "/api/upload-receipt",
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              telegramId,

              username,

              amount,

              imageData

            })
        }
      );

    const data =
      await response.json();

    if (!response.ok ||
        !data.success) {

      throw new Error(
        data.error ||
        "ارسال رسید ناموفق بود."
      );

    }

    hide("form");

    message(
      "✅ رسید با موفقیت ارسال شد و در انتظار بررسی مدیریت است.",
      "success"
    );

  } catch (error) {

    message(
      error.message ||
      "خطا در ارسال رسید.",
      "error"
    );

  }

}


/*
=========================================================
START
=========================================================
*/

window.addEventListener(
  "load",
  authenticate
);

</script>

</body>

</html>
